<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Tactical Gear Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>⚔️ Tactical Gear Store</h1>
  <button onclick="openCart()">🛒 Корзина</button>
</header>

<div id="catalog"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  const catalog = document.getElementById("catalog");

  products.forEach(p => {
    catalog.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>${p.price} грн</p>
        <button onclick="addToCart(${p.id})">Додати</button>
      </div>
    `;
  });
</script>

</body>
</html>
