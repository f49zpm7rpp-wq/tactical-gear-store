<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical UA | Маркетплейс спорядження</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="top-bar">
    <div class="container flex-between">
        <div class="langs"><span>UA</span> | <span>EN</span></div>
        <div class="user-menu">
            <a href="#"><i class="fas fa-balance-scale"></i> Порівняння</a>
            <a href="#"><i class="fas fa-heart"></i> Обране</a>
            <a href="#"><i class="fas fa-user-circle"></i> Кабінет</a>
        </div>
    </div>
</div>

<header>
    <div class="container flex-between">
        <div class="brand">
            <h1>TACTICAL UA</h1>
            <p>ВСЕ ДЛЯ ПЕРЕМОГИ</p>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Я шукаю..." oninput="render()">
            <button><i class="fas fa-search"></i></button>
        </div>
        <div class="header-actions">
            <button onclick="showPage('shop')" class="nav-btn"><i class="fas fa-home"></i></button>
            <button onclick="showPage('cart')" class="cart-btn">
                <i class="fas fa-shopping-basket"></i>
                <span id="cart-count">0</span>
            </button>
        </div>
    </div>
</header>

<div class="container layout">
    <div id="shop-page" class="main-content">
        <div class="shop-header">
            <aside class="sidebar">
                <h3>Категорії</h3>
                <div class="filter-group">
                    <select id="category" onchange="render()">
                        <option value="all">Всі товари</option>
                        <option value="бронежилети">Бронежилети</option>
                        <option value="оптика">Оптика та ПНБ</option>
                        <option value="дрони">БПЛА та комплектуючі</option>
                        <option value="медицина">Тактична медицина</option>
                        <option value="одяг">Форма та взуття</option>
                        <option value="зв'язок">Рації та зв'язок</option>
                    </select>
                </div>
                <h3>Сортування</h3>
                <select id="sort" onchange="render()">
                    <option value="new">Спочатку нові</option>
                    <option value="cheap">Від дешевих</option>
                    <option value="expensive">Від дорогих</option>
                </select>
            </aside>
            
            <main class="products-area">
                <div id="list" class="grid"></div>
            </main>
        </div>
    </div>

    <div id="cart-page" style="display: none;">
        <div class="cart-container">
            <h2>Кошик покупок</h2>
            <div id="full-cart-list"></div>
            <div class="cart-footer">
                <div class="promo">
                    <input type="text" placeholder="Промокод">
                    <button>Застосувати</button>
                </div>
                <div class="totals">
                    <p>До сплати: <span id="total-price">0</span> грн</p>
                    <button class="checkout-btn">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
                    <button class="back-btn" onclick="showPage('shop')">Продовжити покупки</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// РОЗШИРЕНА БАЗА ТОВАРІВ (Імітація великого асортименту)
const catalogData = [
    { name: "Plate Carrier Gen.3", cat: "бронежилети", price: 14500, img: "https://images.unsplash.com/photo-1595078475328-1ab05d0a6a0e?w=400" },
    { name: "Тепловізор Pulsar Helion", cat: "оптика", price: 98000, img: "https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=400" },
    { name: "Mavic 3 Pro Fly More Combo", cat: "дрони", price: 112000, img: "https://images.unsplash.com/photo-1508614589041-895b839676d6?w=400" },
    { name: "Аптечка IFAK NATO", cat: "медицина", price: 3200, img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400" },
    { name: "Рація Motorola DP4801e", cat: "зв'язок", price: 28500, img: "https://images.unsplash.com/photo-1615461066834-3199859f535d?w=400" },
    { name: "Черевики Lowa Zephyr GTX", cat: "одяг", price: 8900, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" }
];

let allProducts = [];
// Генеруємо 200+ товарів на основі шаблонів
for(let i=0; i<250; i++) {
    let base = catalogData[i % catalogData.length];
    allProducts.push({
        id: i,
        ...base,
        name: base.name + " v." + (i+1),
        price: base.price + Math.floor(Math.random() * 1000),
        status: i % 5 === 0 ? "Топ продажів" : "В наявності"
    });
}

let cart = [];

function showPage(p) {
    document.getElementById('shop-page').style.display = p === 'shop' ? 'block' : 'none';
    document.getElementById('cart-page').style.display = p === 'cart' ? 'block' : 'none';
    if(p === 'cart') renderCart();
}

function add(id) {
    cart.push(allProducts.find(p => p.id === id));
    document.getElementById('cart-count').innerText = cart.length;
}

function render() {
    let cat = document.getElementById("category").value;
    let search = document.getElementById("search").value.toLowerCase();
    let sort = document.getElementById("sort").value;

    let filtered = allProducts.filter(p => 
        (cat === "all" || p.cat === cat) && 
        p.name.toLowerCase().includes(search)
    );

    if(sort === 'cheap') filtered.sort((a,b) => a.price - b.price);
    if(sort === 'expensive') filtered.sort((a,b) => b.price - a.price);

    document.getElementById("list").innerHTML = filtered.map(p => `
        <div class="card">
            <div class="badge">${p.status}</div>
            <div class="card-img" style="background-image: url('${p.img}')"></div>
            <div class="card-content">
                <p class="category-label">${p.cat}</p>
                <h4>${p.name}</h4>
                <div class="price-row">
                    <span class="price-val">${p.price.toLocaleString()} ₴</span>
                    <button onclick="add(${p.id})"><i class="fas fa-shopping-cart"></i></button>
                </div>
            </div>
        </div>
    `).join("");
}

function renderCart() {
    const list = document.getElementById("full-cart-list");
    list.innerHTML = cart.length === 0 ? "<h3>Кошик порожній</h3>" : 
        cart.map((c, i) => `
            <div class="cart-row">
                <img src="${c.img}" width="60">
                <div class="info">
                    <h5>${c.name}</h5>
                    <p>${c.price} ₴</p>
                </div>
                <button onclick="remove(${i})"><i class="fas fa-times"></i></button>
            </div>
        `).join("");
    document.getElementById("total-price").innerText = cart.reduce((s,x)=>s+x.price,0).toLocaleString();
}

function remove(i) {
    cart.splice(i, 1);
    document.getElementById('cart-count').innerText = cart.length;
    renderCart();
}

render();
</script>
</body>
</html>
