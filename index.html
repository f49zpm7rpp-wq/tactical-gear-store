<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical UA | Професійне військове спорядження</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-flex">
                <div class="contacts">
                    <i class="fas fa-phone"></i> 0 800 33-22-11 • 
                    <i class="fas fa-clock"></i> 24/7 • Безкоштовна доставка від 5000 грн
                </div>
                <div class="lang-switcher">
                    <span class="active">UA</span> | EN
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header">
        <div class="container header-content">
            <div class="logo" onclick="window.location.href='index.html'">
                <h1>TACTICAL<span>UA</span></h1>
                <small>Все для перемоги</small>
            </div>

            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Пошук бронежилетів, шоломів, дронів..." 
                       onkeypress="if(event.key === 'Enter') goToShop()">
                <button onclick="goToShop()"><i class="fas fa-search"></i></button>
            </div>

            <div class="header-actions">
                <button class="icon-btn"><i class="fas fa-heart"></i></button>
                <button class="icon-btn cart-btn" onclick="window.location.href='cart.html'">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="cart-count">0</span>
                </button>
                <button class="icon-btn"><i class="fas fa-user"></i></button>
            </div>
        </div>

        <!-- Головне меню -->
        <nav class="main-nav">
            <div class="container">
                <ul class="nav-list">
                    <li onclick="goToShop('all')">Каталог</li>
                    <li onclick="goToShop('Захист')">Захист</li>
                    <li onclick="goToShop('Шоломи')">Шоломи</li>
                    <li onclick="goToShop('Одяг')">Одяг</li>
                    <li onclick="goToShop('Оптика')">Оптика</li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h2>Професійне спорядження<br>для тих, хто захищає Україну</h2>
            <p>Оригінальна екіпіровка • Гарантія • Швидка доставка</p>
            <button class="cta-button" onclick="goToShop('all')">Переглянути каталог</button>
        </div>
    </section>

    <!-- Хіти продажів -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Хіти продажів</h2>
            <div id="hits-grid" class="products-grid"></div>
        </div>
    </section>

    <script src="data.js"></script>
    <script src="jscart.js"></script>
    <script src="script.js"></script>
</body>
</html>
