<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tactical UA Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">TACTICAL UA STORE</div>
        <div class="sub">300+ позицій спорядження</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <h3>Фільтри</h3>
        <select id="category">
            <option value="all">Всі категорії</option>
            <option value="armor">Захист</option>
            <option value="clothes">Одяг</option>
            <option value="gear">Спорядження</option>
            <option value="electronics">Електроніка</option>
            <option value="medical">Медицина</option>
            <option value="drones">БПЛА</option>
        </select>
        <input id="search" placeholder="Пошук..." />
        <button class="btn-main" onclick="render()">Застосувати</button>
    </aside>

    <main class="main">
        <div id="list" class="grid"></div>
    </main>

    <aside class="cart">
        <h3>Кошик</h3>
        <div id="cart-items"></div>
        <div class="total">Разом: <span id="total-price">0</span> грн</div>
    </aside>
</div>

<script>
// Дані (лишаємо як були)
const names = ["Plate Carrier LBT", "FAST Helmet", "CAT Tourniquet", "Mavic 3", "PVS-14", "Softshell Jacket"];
const categories = ["armor","clothes","gear","electronics","medical","drones"];
let products = [];
for(let i=1;i<=300;i++){
    products.push({
        id:i,
        name: names[i % names.length] + " Mk." + (i%5+1),
        cat: categories[i % categories.length],
        price: Math.floor(Math.random()*15000 + 500)
    });
}

let cart = [];
function add(id){
    cart.push(products.find(p=>p.id===id));
    updateCart();
}
function updateCart(){
    document.getElementById("cart-items").innerHTML = cart.map(c=>`<div class="cart-item">${c.name} - <b>${c.price}</b></div>`).join("");
    document.getElementById("total-price").innerText = cart.reduce((s,i)=>s+i.price,0);
}
function render(){
    let cat = document.getElementById("category").value;
    let search = document.getElementById("search").value.toLowerCase();
    document.getElementById("list").innerHTML = products
        .filter(p => (cat==="all" || p.cat===cat) && p.name.toLowerCase().includes(search))
        .map(p=>`<div class="card">
            <div class="tag">${p.cat}</div>
            <div class="title">${p.name}</div>
            <div class="price">${p.price} грн</div>
            <button onclick="add(${p.id})">Додати</button>
        </div>`).join("");
}
render();
</script>
</body>
</html>
