<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical Gear Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Тактичний магазин</h1>
  <p>Екіпірування та спорядження</p>
</header>

<section class="products">
  <h2>Асортимент</h2>

  <div class="grid">
    
    <div class="card">
      <h3>Тактичний рюкзак</h3>
      <p>Міцний, 30L, водостійкий</p>
      <span>2500 грн</span>
      <button>Купити</button>
    </div>

    <div class="card">
      <h3>Бронежилет</h3>
      <p>Легка плитоноска</p>
      <span>8500 грн</span>
      <button>Купити</button>
    </div>

    <div class="card">
      <h3>Тактичні рукавиці</h3>
      <p>Захист + хват</p>
      <span>900 грн</span>
      <button>Купити</button>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 Tactical Gear Store</p>
</footer>

</body>
</html>
