<!DOCTYPE html>
<header>
<div><b>TACTICAL UA STORE</b></div>
<div>Каталог 300+ позицій</div>
</header>

<div class="container">
<div class="sidebar">
<h3>Фільтри</h3>
<select id="category">
<option value="all">Всі</option>
<option value="armor">Захист</option>
<option value="clothes">Одяг</option>
<option value="gear">Спорядження</option>
<option value="electronics">Електроніка</option>
</select>
<input id="search" placeholder="Пошук..." />
<button class="btn" onclick="render()">Застосувати</button>
</div>

<div class="main">
<div id="list" class="grid"></div>
</div>
</div>

<div class="cart">
<b>Кошик</b>
<div id="cart"></div>
</div>

<script>
const categories=["armor","clothes","gear","electronics"];
let products=[];
for(let i=1;i<=300;i++){
products.push({
id:i,
name:"Товар №"+i,
cat:categories[i%categories.length],
price:Math.floor(Math.random()*5000+500)
});
}

let cart=[];

function add(id){
let p=products.find(x=>x.id===id);
cart.push(p);
updateCart();
}

function updateCart(){
document.getElementById("cart").innerHTML=cart.map(c=>`<div>${c.name} - ${c.price}₴</div>`).join("");
}

function render(){
let cat=document.getElementById("category").value;
let search=document.getElementById("search").value.toLowerCase();
let html=products.filter(p=> (cat=="all"||p.cat==cat) && p.name.toLowerCase().includes(search))
.map(p=>`
<div class='card'>
<div><b>${p.name}</b></div>
<div class='small'>${p.cat}</div>
<div>${p.price} грн</div>
<button class='btn' onclick='add(${p.id})'>Додати</button>
</div>`).join("");
document.getElementById("list").innerHTML=html;
}

render();
</script>
</body>
</html>
